services:
  litellm:
    image: ghcr.io/berriai/litellm:v1.101.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:4000:4000"
    env_file:
      - ${JEV_VIP_ENV_FILE:-.env}
    volumes:
      - ./relay/litellm/config.yaml:/app/config.yaml:ro
      - ./relay/litellm/jev_provider.py:/app/jev_provider.py:ro
    command:
      - --config
      - /app/config.yaml
      - --port
      - "4000"
