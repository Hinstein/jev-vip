name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      AUTH_SECRET: ci-only-auth-secret-ci-only-auth-secret
      BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm arch:check
      - run: pnpm exec tsc --noEmit
      - run: node --check relay/jev-adapter/server.mjs
      - run: node --check scripts/e2e-backend.mjs
      - run: pnpm build
