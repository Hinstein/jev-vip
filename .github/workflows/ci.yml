name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      AUTH_SECRET: ci-only-auth-secret-ci-only-auth-secret
      BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Resolve patched dependency tree
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          Object.assign(p.dependencies, {
            '@tailwindcss/postcss': '4.3.3',
            autoprefixer: '10.6.1',
            postcss: '8.5.28',
            tailwindcss: '4.3.3',
          });
          p.pnpm = {
            ...(p.pnpm || {}),
            overrides: {
              ...(p.pnpm?.overrides || {}),
              tar: '7.5.21',
              postcss: '8.5.28',
              browserslist: '4.28.7',
              nanoid: '3.3.18',
              sharp: '0.35.4',
            },
          };
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          NODE
          pnpm install --no-frozen-lockfile
      - run: pnpm arch:check
      - run: pnpm audit --prod --audit-level=high
      - run: pnpm exec tsc --noEmit
      - run: node --check relay/jev-adapter/server.mjs
      - run: node --check scripts/e2e-backend.mjs
      - run: pnpm build
      - name: Commit patched dependency lock
        if: success() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          cp package.json /tmp/package.json
          cp pnpm-lock.yaml /tmp/pnpm-lock.yaml
          git fetch origin codex/new-api-backend
          git checkout -B codex/new-api-backend origin/codex/new-api-backend
          cp /tmp/package.json package.json
          cp /tmp/pnpm-lock.yaml pnpm-lock.yaml
          if git diff --quiet -- package.json pnpm-lock.yaml; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          git commit -m "fix: patch production dependency advisories"
          git push origin HEAD:codex/new-api-backend
